<!-- index.html — 전체 교체, 1~343행 -->

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b1210"
  >

  <meta
    name="description"
    content="Armored Tactical Simulator mobile prototype"
  >

  <title>
    ATS — Armored Tactical Simulator
  </title>

  <link
    rel="stylesheet"
    href="./src/styles.css?v=0.3.6"
  >

  <script type="module">
    const errorBox =
      document.createElement(
        "pre",
      );

    errorBox.style.position =
      "fixed";

    errorBox.style.inset =
      "12px";

    errorBox.style.zIndex =
      "99999";

    errorBox.style.display =
      "none";

    errorBox.style.padding =
      "14px";

    errorBox.style.overflow =
      "auto";

    errorBox.style.whiteSpace =
      "pre-wrap";

    errorBox.style.background =
      "#240b0b";

    errorBox.style.color =
      "#ffb4b4";

    errorBox.style.border =
      "1px solid #ff6b6b";

    errorBox.style.borderRadius =
      "10px";

    document.body.append(
      errorBox,
    );

    function showError(error) {
      errorBox.style.display =
        "block";

      errorBox.textContent =
        "ATS 실행 오류\n\n" +
        (
          error?.stack ??
          error?.message ??
          String(error)
        );
    }

    window.addEventListener(
      "error",
      (event) => {
        showError(
          event.error ??
          event.message,
        );
      },
    );

    window.addEventListener(
      "unhandledrejection",
      (event) => {
        showError(
          event.reason,
        );
      },
    );

    try {
      await import(
        "./src/app.js?v=0.3.6"
      );
    } catch (error) {
      showError(error);
    }
  </script>
</head>

<body>
  <div
    id="app"
    class="app-shell"
  >
    <main
      id="menu-screen"
      class="screen screen--active"
      aria-labelledby="game-title"
    >
      <section class="menu-screen">
        <header class="menu-screen__header">
          <p class="eyebrow">
            ATS v0.3.6
          </p>

          <h1 id="game-title">
            Armored Tactical Simulator
          </h1>

          <p class="subtitle">
            Train. Think. Command.
          </p>
        </header>

        <nav
          class="menu-actions"
          aria-label="게임 메뉴"
        >
          <button
            class="menu-button menu-button--primary"
            type="button"
            data-action="open-battle"
          >
            전투 화면 시작
          </button>

          <button
            class="menu-button"
            type="button"
            data-action="open-settings"
          >
            설정
          </button>

          <button
            class="menu-button"
            type="button"
            data-action="open-project-info"
          >
            프로젝트 정보
          </button>
        </nav>
      </section>
    </main>

    <main
      id="battle-screen"
      class="screen"
      aria-label="전투 화면"
      hidden
    >
      <section class="battle-layout">
        <header class="battle-header">
          <button
            class="icon-button"
            type="button"
            data-action="return-menu"
            aria-label="메인 메뉴로 돌아가기"
          >
            ←
          </button>

          <div class="battle-header__status">
            <strong>
              단차전투기술
            </strong>

            <span id="turn-label">
              TURN 1
            </span>
          </div>

          <div class="battle-header__actions">
            <button
              class="icon-button"
              type="button"
              data-action="restart-scenario"
              aria-label="시나리오 다시 시작"
              title="시나리오 다시 시작"
            >
              ↻
            </button>

            <button
              class="icon-button"
              type="button"
              data-action="center-camera"
              aria-label="자차 위치로 지도 이동"
              title="자차 중앙 표시"
            >
              ◎
            </button>
          </div>
        </header>

        <section
          id="map-area"
          class="map-area"
          aria-label="육각형 전술 지도"
        >
          <canvas
            id="battle-map"
            class="battle-map"
            aria-label="전술 지도"
          >
            현재 브라우저는 Canvas를 지원하지 않습니다.
          </canvas>

          <div
            class="map-controls"
            aria-label="지도 조작"
          >
            <button
              class="map-control"
              type="button"
              data-action="zoom-in"
              aria-label="지도 확대"
            >
              +
            </button>

            <button
              class="map-control"
              type="button"
              data-action="zoom-out"
              aria-label="지도 축소"
            >
              −
            </button>
          </div>

          <div
            id="map-message"
            class="map-message"
            role="status"
            aria-live="polite"
          >
            지도를 드래그해 이동할 수 있습니다.
          </div>
        </section>

        <section
          class="command-dock"
          aria-label="자차 전투 명령"
        >
          <div class="unit-summary">
            <div>
              <span>
                현재 조작
              </span>

              <strong id="selected-unit-label">
                P0 자차
              </strong>
            </div>

            <div>
              <span>
                현재 명령
              </span>

              <strong id="current-command-label">
                대기
              </strong>
            </div>

            <div>
              <span>
                상태
              </span>

              <strong id="unit-condition-label">
                정상
              </strong>
            </div>
          </div>

          <div
            class="command-categories command-categories--vehicle"
            aria-label="명령 분야"
          >
            <button
              class="command-category"
              type="button"
              data-command-category="hull"
            >
              차체
            </button>

            <button
              class="command-category"
              type="button"
              data-command-category="turret"
            >
              포탑
            </button>

            <button
              class="command-category"
              type="button"
              data-command-category="fire"
            >
              사격
            </button>
          </div>

          <div
            id="command-options"
            class="command-options"
            aria-live="polite"
          >
            <p>
              차체, 포탑 또는 사격 명령 분야를 선택하세요.
            </p>
          </div>

          <button
            id="execute-turn-button"
            class="execute-turn-button"
            type="button"
            data-action="execute-turn"
          >
            명령 실행 / 다음 턴
          </button>
        </section>
      </section>
    </main>

    <dialog
      id="settings-dialog"
      class="app-dialog"
    >
      <form method="dialog">
        <header class="dialog-header">
          <h2>
            설정
          </h2>

          <button
            class="icon-button"
            value="close"
            aria-label="닫기"
          >
            ×
          </button>
        </header>

        <div class="dialog-content">
          <label class="setting-row">
            <span>
              난이도
            </span>

            <select id="difficulty-select">
              <option value="beginner">
                입문
              </option>

              <option
                value="standard"
                selected
              >
                표준
              </option>

              <option value="advanced">
                숙련
              </option>

              <option value="simulation">
                시뮬레이션
              </option>
            </select>
          </label>

          <label class="setting-row">
            <span>
              개발자 표시
            </span>

            <input
              id="developer-mode-toggle"
              type="checkbox"
            >
          </label>
        </div>
      </form>
    </dialog>

    <dialog
      id="project-info-dialog"
      class="app-dialog"
    >
      <form method="dialog">
        <header class="dialog-header">
          <h2>
            프로젝트 정보
          </h2>

          <button
            class="icon-button"
            value="close"
            aria-label="닫기"
          >
            ×
          </button>
        </header>

        <div class="dialog-content">
          <p>
            ATS는 모바일 환경에서 제한된 정보와 지형을 바탕으로
            전차장의 전술적 판단을 훈련하는 WEGO 방식의
            의사결정 시뮬레이터입니다.
          </p>

          <p>
            현재 단계: Sprint 3.4
          </p>
        </div>
      </form>
    </dialog>
  </div>

  <noscript>
    ATS를 실행하려면 JavaScript를 활성화해야 합니다.
  </noscript>
</body>
</html>
